services:
  mysql:
    image: mysql:8.0.36
    container_name: smartstay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend-smartstay-db}
      MYSQL_USER: ${MYSQL_USER:-smartstay_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartstay_password}
    ports:
    - ${MYSQL_PORT:-3306}:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ./deploy/mysql/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -prootpassword
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: smartstay-activemq
    restart: unless-stopped
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
    - ${ACTIVEMQ_OPENWIRE_PORT:-61616}:61616
    - ${ACTIVEMQ_WEB_PORT:-8161}:8161
    volumes:
    - activemq_data:/opt/apache-activemq/data
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/61616
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  gateway:
    image: nginx:1.25-alpine
    container_name: smartstay-gateway
    restart: unless-stopped
    ports:
    - ${GATEWAY_PORT:-8080}:80
    volumes:
    - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - iam
    - accommodations
    - bookings
    - payments
    - profiles
    - analytics
    - concierge
  iam:
    build:
      context: .
      dockerfile: src/Services/SmartStay.IAM/Dockerfile
    container_name: smartstay-iam
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IamConnection: server=mysql;port=3306;user=iam_user;password=iam_pass;database=smartstay_iam;
      TokenSettings__Secret: ${JWT_SECRET:-EstaEsUnaClaveSecretaMuyLargaYSeguraParaSmartStay123!}
      TokenSettings__Audience: ${JWT_AUDIENCE:-http://localhost:5173}
      TokenSettings__Issuer: ${JWT_ISSUER:-http://localhost:5192}
      TokenSettings__ExpirationInHours: ${JWT_EXPIRATION_HOURS:-24}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  accommodations:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Accommodations/Dockerfile
    container_name: smartstay-accommodations
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AccommodationsConnection: server=mysql;port=3306;user=accommodations_user;password=accommodations_pass;database=smartstay_accommodations;
      Services__IamUrl: http://iam:8080
    depends_on:
      mysql:
        condition: service_healthy
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  bookings:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Bookings/Dockerfile
    container_name: smartstay-bookings
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingsConnection: server=mysql;port=3306;user=bookings_user;password=bookings_pass;database=smartstay_bookings;
      Services__AccommodationsUrl: http://accommodations:8080
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
      accommodations:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  payments:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Payments/Dockerfile
    container_name: smartstay-payments
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PaymentsConnection: server=mysql;port=3306;user=payments_user;password=payments_pass;database=smartstay_payments;
      Services__BookingsUrl: http://bookings:8080
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
      bookings:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  profiles:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Profiles/Dockerfile
    container_name: smartstay-profiles
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProfilesConnection: server=mysql;port=3306;user=profiles_user;password=profiles_pass;database=smartstay_profiles;
      Services__IamUrl: http://iam:8080
    depends_on:
      mysql:
        condition: service_healthy
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  analytics:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Analytics/Dockerfile
    container_name: smartstay-analytics
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AnalyticsConnection: server=mysql;port=3306;user=analytics_user;password=analytics_pass;database=smartstay_analytics;
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  concierge:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Concierge/Dockerfile
    container_name: smartstay-concierge
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Services__AccommodationsUrl: http://accommodations:8080
      Services__BookingsUrl: http://bookings:8080
      Services__IamUrl: http://iam:8080
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      DeepSeek__Model: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      iam:
        condition: service_started
      accommodations:
        condition: service_started
      bookings:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  iam-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_iam
      < /migrations/iam.sql
  accommodations-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_accommodations
      < /migrations/accommodations.sql
  bookings-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_bookings
      < /migrations/bookings.sql
  payments-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_payments
      < /migrations/payments.sql
  profiles-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_profiles
      < /migrations/profiles.sql
  analytics-migrate:
    image: mysql:8.0.36
    profiles:
    - migration
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
    - ./artifacts/migrations:/migrations:ro
    entrypoint:
    - sh
    - -c
    - mysql -h mysql -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} smartstay_analytics
      < /migrations/analytics.sql
volumes:
  mysql_data: null
  activemq_data: null
