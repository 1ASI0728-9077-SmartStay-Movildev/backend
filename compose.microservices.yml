services:
  mysql:
    image: mysql:8.0
    container_name: smartstay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartstay_legacy}
      MYSQL_USER: ${MYSQL_USER:-smartstay_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartstay_password}
    ports:
    - ${MYSQL_PORT:-3306}:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -u
      - root
      - -p${MYSQL_ROOT_PASSWORD:-rootpassword}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  migrate:
    build:
      context: .
      dockerfile: tools/SmartStay.Database/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      MYSQL_REQUIRE_TLS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: smartstay-activemq
    restart: unless-stopped
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
    - ${ACTIVEMQ_OPENWIRE_PORT:-61616}:61616
    - ${ACTIVEMQ_WEB_PORT:-8161}:8161
    volumes:
    - activemq_data:/opt/apache-activemq/data
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/61616
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  gateway:
    image: nginx:1.25-alpine
    container_name: smartstay-gateway
    restart: unless-stopped
    ports:
    - ${GATEWAY_PORT:-8080}:80
    volumes:
    - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - iam
    - accommodations
    - bookings
    - payments
    - profiles
    - analytics
    - concierge
  iam:
    build:
      context: .
      dockerfile: src/Services/SmartStay.IAM/Dockerfile
    container_name: smartstay-iam
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IamConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      TokenSettings__Secret: ${JWT_SECRET:-EstaEsUnaClaveSecretaMuyLargaYSeguraParaSmartStay123!}
      TokenSettings__Audience: ${JWT_AUDIENCE:-http://localhost:5173}
      TokenSettings__Issuer: ${JWT_ISSUER:-http://localhost:5192}
      TokenSettings__ExpirationInHours: ${JWT_EXPIRATION_HOURS:-24}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  accommodations:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Accommodations/Dockerfile
    container_name: smartstay-accommodations
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AccommodationsConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__IamUrl: http://iam:8080
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  bookings:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Bookings/Dockerfile
    container_name: smartstay-bookings
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingsConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__AccommodationsUrl: http://accommodations:8080
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
      accommodations:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  payments:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Payments/Dockerfile
    container_name: smartstay-payments
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PaymentsConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__BookingsUrl: http://bookings:8080
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
      bookings:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  profiles:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Profiles/Dockerfile
    container_name: smartstay-profiles
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProfilesConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__IamUrl: http://iam:8080
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  analytics:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Analytics/Dockerfile
    container_name: smartstay-analytics
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AnalyticsConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__IamUrl: http://iam:8080
      ActiveMq__BrokerUri: tcp://activemq:61616
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      activemq:
        condition: service_healthy
      iam:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
  concierge:
    build:
      context: .
      dockerfile: src/Services/SmartStay.Concierge/Dockerfile
    container_name: smartstay-concierge
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ConciergeConnection: ${MYSQL_CONNECTION_STRING:-Server=mysql;Port=3306;Database=smartstay_legacy;User ID=smartstay_user;Password=smartstay_password;SslMode=None;AllowPublicKeyRetrieval=true;}
      Services__AccommodationsUrl: http://accommodations:8080
      Services__BookingsUrl: http://bookings:8080
      Services__PaymentsUrl: http://payments:8080
      Services__IamUrl: http://iam:8080
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      DeepSeek__Model: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      iam:
        condition: service_started
      accommodations:
        condition: service_started
      bookings:
        condition: service_started
      payments:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - </dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
    - '8080'
volumes:
  activemq_data: null
  mysql_data: null
