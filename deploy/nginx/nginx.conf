events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstreams del sistema SmartStay
    upstream legacy_api {
        server legacy:8080;
    }

    upstream accommodations_api {
        server accommodations:8080;
    }

    upstream bookings_api {
        server bookings:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Configuración común de headers proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Manejo de preflight CORS global
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Idempotency-Key, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Health Checks
        location /health {
            proxy_pass http://legacy_api/health;
        }

        # Bloqueo estricto de rutas internas desde el Gateway
        location /internal/ {
            return 403 "Forbidden: Internal endpoints cannot be accessed from gateway.\n";
        }

        # Swagger y OpenAPI
        location ~ ^/(swagger|index.html) {
            proxy_pass http://legacy_api;
        }

        # Rutas de Accommodations redirigidas al nuevo microservicio independiente (Fase 3)
        location ~ ^/api/v1/(hotels|rooms|room-types|accommodations)(/|$) {
            proxy_pass http://accommodations_api;
        }

        # Rutas de Bookings redirigidas al nuevo microservicio independiente (Fase 4)
        location ~ ^/api/v1/bookings(/|$) {
            proxy_pass http://bookings_api;
        }

        # Resto de rutas de negocio van al monolito legado
        location /api/v1/ {
            proxy_pass http://legacy_api;
        }

        # Ruta de respaldo
        location / {
            proxy_pass http://legacy_api;
        }
    }
}
