events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=concierge_limit:10m rate=10r/m;
    limit_req_status 429;

    # Upstreams de los microservicios SmartStay
    upstream iam_api {
        server iam:8080;
    }

    upstream accommodations_api {
        server accommodations:8080;
    }

    upstream bookings_api {
        server bookings:8080;
    }

    upstream payments_api {
        server payments:8080;
    }

    upstream profiles_api {
        server profiles:8080;
    }

    upstream analytics_api {
        server analytics:8080;
    }

    upstream concierge_api {
        server concierge:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Configuración común de headers proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Manejo de preflight CORS global
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Idempotency-Key, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Health Checks del API Gateway
        location /health {
            proxy_pass http://iam_api/health;
        }

        # Bloqueo estricto de rutas internas desde el Gateway
        location ^~ /internal/ {
            default_type application/json;
            return 403 '{"status":403,"error":"Forbidden","message":"Internal endpoints cannot be accessed from gateway."}\n';
        }

        # Swagger y OpenAPI
        location ~ ^/(swagger|index.html) {
            proxy_pass http://iam_api;
        }

        # 1. IAM y Autenticación (Fase 7)
        location ~ ^/api/v1/(authentication|users)(/|$) {
            proxy_pass http://iam_api;
        }

        # 2. Accommodations y Recorridos Virtuales 360 (Fase 2 MVP)
        location ~ ^/(api/v1/(hotels|rooms|room-types|accommodations)|tours)(/|$) {
            proxy_pass http://accommodations_api;
        }

        # 3. Bookings (Fase 4)
        location ~ ^/api/v1/bookings(/|$) {
            proxy_pass http://bookings_api;
        }

        # 4. Payments (Fase 5)
        location ~ ^/api/v1/payments(/|$) {
            proxy_pass http://payments_api;
        }

        # 5. Profiles (Fase 6)
        location ~ ^/api/v1/profiles(/|$) {
            proxy_pass http://profiles_api;
        }

        # 6. Analytics (Fase 8)
        location ~ ^/api/v1/analytics(/|$) {
            proxy_pass http://analytics_api;
        }

        # 7. SmartStay Concierge Asistido (Fase 3 MVP)
        location ~ ^/api/v1/concierge(/|$) {
            limit_req zone=concierge_limit burst=5 nodelay;
            proxy_pass http://concierge_api;
        }

        # 8. Fallback para rutas no existentes
        location / {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"Endpoint not recognized by SmartStay Microservices Gateway"}\n';
        }
    }
}
